name: Build and deploy ASP.Net Core app to Azure Web App - GameScoringAPI

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
          include-prerelease: true

      - name: Build API
        run: dotnet build ./api/GameScoringAPI.csproj --configuration Release

      - name: Generate appsettings.Production.json from secrets
        shell: pwsh
        run: |
          # The base api/appsettings.json is gitignored and never reaches the runner,
          # so this generates a COMPLETE production config: non-secret settings
          # (logging, host, database options) plus the connection string secret.
          $json = @{
            Logging = @{
              LogLevel = @{
                Default = "Information"
                "Microsoft.AspNetCore" = "Warning"
                "Microsoft.EntityFrameworkCore.Database.Command" = "Warning"
                "Microsoft.EntityFrameworkCore.Migrations" = "Information"
              }
            }
            AllowedHosts = "*"
            Database = @{
              # false = keep serving in degraded mode and report via GET /health
              FailFastOnStartup = $false
            }
            ConnectionStrings = @{
              DatabaseUrl = "${{ secrets.DATABASE_URL }}"
            }
          } | ConvertTo-Json -Depth 5
          $path = Join-Path "${{ github.workspace }}" "api/appsettings.Production.json"
          [System.IO.File]::WriteAllText($path, $json, (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "Wrote $path ($($json.Length) chars)"

      - name: Publish API
        run: dotnet publish ./api/GameScoringAPI.csproj --configuration Release --output "${{ github.workspace }}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ github.workspace }}/myapp

  deploy:
    runs-on: windows-latest
    needs: build

    environment:
      name: production
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    permissions:
      id-token: write

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_83F335E4A2F74D268EF4A2D0E93CFA05 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9F0A8D33199A4E9FA0CF890CFFA0E8AD }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0299E43265514FEABC51FA61A777A8E1 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: GameScoringAPI
          slot-name: Production
          package: .
